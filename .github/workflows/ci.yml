name: ChatBridge CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chatbridge-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test

jobs:
  typecheck-lint-build-unit:
    name: Locked Install, Typecheck, Build & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare SHA report directory
        run: mkdir -p ".ci-reports/${{ github.sha }}"

      - name: Run TypeScript typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build TypeScript output
        run: npm run build

      - name: Run unit and smoke tests (synthetic defaults only)
        env:
          CHATBRIDGE_USE_SYNTHETIC_DEFAULTS: "true"
        run: |
          set -o pipefail
          npm test | tee ".ci-reports/${{ github.sha }}/unit-test-output.txt"

      - name: Exercise single-tick worker startup (redacted)
        env:
          CHATBRIDGE_USE_SYNTHETIC_DEFAULTS: "true"
          CHATBRIDGE_WORKER_ONCE: "true"
        run: |
          set -o pipefail
          npm run start:worker | tee ".ci-reports/${{ github.sha }}/worker-smoke.json"

      - name: Verify zero unredacted secrets in CI reports
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(f".ci-reports/${{ github.sha }}")
          forbidden = [
              r"sk_live_", r"-----BEGIN", r"SYNTHETIC_BYPASS_LEAK",
              r"postgres(?:ql)?://[^:]+:(?!ci_synthetic_pg_pass@)[^@]+@"
          ]
          for p in root.rglob("*"):
              if p.is_file():
                  txt = p.read_text(encoding="utf-8", errors="replace")
                  for pat in forbidden:
                      if re.search(pat, txt):
                          print(f"Forbidden unredacted pattern {pat} in {p}", file=sys.stderr)
                          sys.exit(1)
          print(f"Redaction check passed for {root}")
          PY

      - name: Upload redacted unit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbridge-unit-reports-${{ github.sha }}
          path: .ci-reports/${{ github.sha }}/
          retention-days: 14

  postgres-migration-and-integration:
    name: Disposable PostgreSQL Fixtures & Integration Gate
    runs-on: ubuntu-24.04
    needs: typecheck-lint-build-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatbridge_ci_owner
          POSTGRES_PASSWORD: ci_synthetic_pg_pass
          POSTGRES_DB: chatbridge_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U chatbridge_ci_owner -d chatbridge_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare report folder and verify PostgreSQL fixture connectivity
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: "chatbridge_ci_owner"
          PGPASSWORD: "ci_synthetic_pg_pass"
          PGDATABASE: "chatbridge_ci"
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          mkdir -p ".ci-reports/${{ github.sha }}"
          psql -v ON_ERROR_STOP=1 -c "SELECT version() AS postgres_version;" | tee ".ci-reports/${{ github.sha }}/pg-fixture-version.txt"

      - name: Apply repository SQL migrations cleanly (fail fast on broken SQL)
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: "chatbridge_ci_owner"
          PGPASSWORD: "ci_synthetic_pg_pass"
          PGDATABASE: "chatbridge_ci"
        run: |
          set -euo pipefail
          shopt -s nullglob
          sql_files=(database-adapters/migrations/*.sql migrations/*.sql)
          if [ ${#sql_files[@]} -eq 0 ]; then
            echo '{"migrations_applied": 0, "status": "NO_MIGRATIONS_YET_READY"}' > ".ci-reports/${{ github.sha }}/migration-report.json"
          else
            count=0
            for f in "${sql_files[@]}"; do
              echo "Applying migration: $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
              count=$((count + 1))
            done
            echo "{\"migrations_applied\": $count, \"status\": \"APPLIED_OK\"}" > ".ci-reports/${{ github.sha }}/migration-report.json"
          fi

      - name: Run DB isolation or integration tests when present
        env:
          CHATBRIDGE_USE_SYNTHETIC_DEFAULTS: "true"
          DATABASE_URL: "postgresql://chatbridge_ci_owner:ci_synthetic_pg_pass@127.0.0.1:5432/chatbridge_ci"
        run: |
          set -euo pipefail
          shopt -s nullglob
          db_tests=(tests/*db*.test.ts tests/integration/*.test.ts database-adapters/tests/*.test.ts)
          if [ ${#db_tests[@]} -gt 0 ]; then
            if ! node --import tsx --test --test-concurrency=1 --test-reporter=spec "${db_tests[@]}" > ".ci-reports/${{ github.sha }}/integration-report.txt" 2>&1; then
              cat ".ci-reports/${{ github.sha }}/integration-report.txt"
              summary=$(tail -n 30 ".ci-reports/${{ github.sha }}/integration-report.txt" | tr "\r\n" " " | cut -c1-950)
              echo "::error title=DB Integration Tests Failed::${summary}"
              exit 1
            fi
            cat ".ci-reports/${{ github.sha }}/integration-report.txt"
          else
            echo "No DB integration tests committed yet; disposable PostgreSQL gate ready for ID-01-04." > ".ci-reports/${{ github.sha }}/integration-report.txt"
          fi

      - name: Upload redacted PostgreSQL fixture report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbridge-db-reports-${{ github.sha }}
          path: .ci-reports/${{ github.sha }}/
          retention-days: 14
  compose-isolation-and-restart:
    name: Standalone ChatBridge Compose Build, Role, Health & Restart Gate
    runs-on: ubuntu-24.04
    needs: typecheck-lint-build-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration with synthetic env.example
        run: |
          set -euo pipefail
          docker compose --env-file env.example -f compose.yaml config --quiet

      - name: Build locked image and boot standalone ChatBridge Compose stack
        run: |
          set -euo pipefail
          mkdir -p ".ci-reports/${{ github.sha }}"
          docker compose --env-file env.example -f compose.yaml up -d --build --wait
          docker compose --env-file env.example -f compose.yaml ps | tee ".ci-reports/${{ github.sha }}/compose-ps-initial.txt"

      - name: Verify non-root execution, HTTP readiness, redacted secrets, and least-privilege DB role
        run: |
          set -euo pipefail
          api_uid=$(docker compose --env-file env.example -f compose.yaml exec -T api id -u)
          worker_uid=$(docker compose --env-file env.example -f compose.yaml exec -T worker id -u)
          echo "api_uid=${api_uid} worker_uid=${worker_uid}" | tee ".ci-reports/${{ github.sha }}/compose-uids.txt"
          test "${api_uid}" != "0"
          test "${worker_uid}" != "0"

          curl -fsS http://127.0.0.1:4200/healthz | grep -q '"status":"ok"'
          ready_json=$(curl -fsS http://127.0.0.1:4200/readyz)
          echo "${ready_json}" | grep -q '"status":"ready"'
          echo "${ready_json}" | grep -q '"database":"READY"'
          echo "${ready_json}" | grep -q '"outboxQueue":"READY"'
          echo "${ready_json}" | grep -qv 'synthetic_pg_app_password_change_me'
          echo "${ready_json}" | grep -qv 'synthetic-dev-integration-hmac-secret'

          # Prove runtime DB user (chatbridge_runtime -> chatbridge_app) authenticates and cannot run DDL
          if docker compose --env-file env.example -f compose.yaml exec -T -e PGPASSWORD=synthetic_pg_app_password_change_me postgres             psql -h 127.0.0.1 -U chatbridge_runtime -d chatbridge_db -v ON_ERROR_STOP=1 -c "CREATE TABLE unauthorized_ddl(id int);"; then
            echo "ERROR: chatbridge_runtime unexpectedly allowed DDL" >&2
            exit 1
          fi

      - name: Seed committed queue state, restart stack, and verify state preservation
        run: |
          set -euo pipefail
          docker compose --env-file env.example -f compose.yaml exec -T -e PGPASSWORD=synthetic_pg_app_password_change_me postgres             psql -h 127.0.0.1 -U chatbridge_runtime -d chatbridge_db -v ON_ERROR_STOP=1 <<'EOSQL'
          BEGIN;
          INSERT INTO tenants (id, slug, display_name, status)
          VALUES ('11111111-1111-4111-8111-111111111111', 'compose-smoke-tenant', 'Compose Smoke', 'ACTIVE')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO channel_accounts (id, tenant_id, provider, external_ref, display_name, capabilities, connection_status, credential_ref)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', 'LINE', 'line-compose-01', 'Compose LINE', '{"inbound":true}'::jsonb, 'CONNECTED', 'vault/compose-line-01')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO outbox_events (
            id, tenant_id, channel_account_id, aggregate_key, aggregate_version,
            type, schema_version, event_schema_version, contract_revision,
            producer, owner_db, aggregate_type, source_kind, correlation_id,
            payload_minimal, state, attempts
          ) VALUES (
            '33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222', 'conv:compose-restart', 1,
            'message.created', '1.0.0', 1, '1.0.0',
            'chatbridge', 'chatbridge_db', 'conversation', 'LIVE_WEBHOOK', 'corr-compose-restart-001',
            '{"message_seq":1}'::jsonb, 'PENDING', 0
          );
          COMMIT;
          EOSQL

          docker compose --env-file env.example -f compose.yaml restart postgres api worker
          docker compose --env-file env.example -f compose.yaml up -d --wait
          docker compose --env-file env.example -f compose.yaml ps | tee ".ci-reports/${{ github.sha }}/compose-ps-after-restart.txt"

          curl -fsS http://127.0.0.1:4200/readyz | tee ".ci-reports/${{ github.sha }}/compose-readyz-after-restart.json" | grep -q '"status":"ready"'
          pending_count=$(docker compose --env-file env.example -f compose.yaml exec -T -e PGPASSWORD=synthetic_pg_app_password_change_me postgres             psql -h 127.0.0.1 -U chatbridge_runtime -d chatbridge_db -t -A -v ON_ERROR_STOP=1             -c "SELECT COUNT(*) FROM outbox_events WHERE id = '33333333-3333-4333-8333-333333333333' AND state = 'PENDING';")
          echo "preserved_pending_outbox_rows=${pending_count}" | tee -a ".ci-reports/${{ github.sha }}/compose-uids.txt"
          test "${pending_count}" = "1"

      - name: Capture Compose logs and tear down disposable volumes
        if: always()
        run: |
          docker compose --env-file env.example -f compose.yaml logs --no-color > ".ci-reports/${{ github.sha }}/compose-logs.txt" || true
          docker compose --env-file env.example -f compose.yaml down -v || true

      - name: Upload redacted Compose verification report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbridge-compose-reports-${{ github.sha }}
          path: .ci-reports/${{ github.sha }}/
          retention-days: 14
